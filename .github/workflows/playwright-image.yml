name: resolve Playwright image
on:
  workflow_call:
    outputs:
      image:
        description: Playwright image matching the pinned project dependency
        value: ${{ jobs.resolve.outputs.image }}
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image from package.json
        id: image
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path('package.json').read_text())['devDependencies']['@playwright/test']
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError('Pin @playwright/test to an exact stable version for the CI image.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'image=mcr.microsoft.com/playwright:v{version}-noble\n')
          PYTHON
