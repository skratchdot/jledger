name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  playwright-image:
    uses: ./.github/workflows/playwright-image.yml
  check:
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    env:
      # Keep Vite preview binding and Node prerender fetches on the same loopback family.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm test:browser
      - run: JLEDGER_BASE_PATH=/jledger/ pnpm --filter @jledger/web build
      - run: JLEDGER_TEST_BASE_PATH=/jledger/ pnpm test:browser

  compatibility:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git ledger=3.3.2-1+b4
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install pinned hledger
        run: |
          mkdir -p /tmp/jledger-reference
          curl --fail --location --silent --show-error https://github.com/hledgerorg/hledger/releases/download/1.52/hledger-linux-x64.tar.gz -o /tmp/jledger-reference/hledger.tar.gz
          echo '153e1e69696d5e75b2a13bf23983a0355c35999db713910615c6a536a4cd0a41  /tmp/jledger-reference/hledger.tar.gz' | sha256sum --check
          tar -xzf /tmp/jledger-reference/hledger.tar.gz -C /tmp/jledger-reference hledger
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compatibility
        env:
          HLEDGER_BIN: /tmp/jledger-reference/hledger
