name: deploy pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  playwright-image:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/playwright-image.yml
  build:
    needs: playwright-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    env:
      # Keep Vite preview binding and Node prerender fetches on the same loopback family.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Build for GitHub Pages
        run: pnpm --filter @jledger/web build
        env:
          JLEDGER_BASE_PATH: /jledger/
      - name: Test the Pages artifact
        run: pnpm test:browser
        env:
          JLEDGER_TEST_BASE_PATH: /jledger/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
